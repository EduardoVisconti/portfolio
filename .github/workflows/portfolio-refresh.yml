name: Monthly portfolio refresh

# The site's figures go stale silently, and so do the five other places that
# repeat them. This opens one issue a month so they get a deliberate review
# instead of drifting. The figures themselves live in a career inventory kept
# outside this repo, so the issue lists surfaces, not numbers: a number typed
# here would go stale like any other.
#
# Note: scheduled workflows only run from the default branch, so this starts
# firing once it is merged to main.

on:
  schedule:
    - cron: '0 13 3 * *'   # 3rd of each month, 13:00 UTC (09:00 ET)
  workflow_dispatch:        # and on demand

permissions:
  issues: write

jobs:
  open-refresh-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open the refresh issue
        uses: actions/github-script@v9
        with:
          script: |
            const month = new Date().toLocaleString('en-US', {
              month: 'long', year: 'numeric', timeZone: 'America/New_York',
            });

            const body = [
              '@EduardoVisconti - monthly check on the six surfaces that state the same facts.',
              '',
              'No Claude Code: "atualiza o inventário de carreira". Só atualize se algum número',
              'cruzou o próximo patamar, ou se houve entrega nova, marco ou mudança de papel.',
              '',
              '### Surfaces, in this order',
              '',
              '- [ ] Resume, versions A and B',
              '- [ ] `public/resume.pdf`',
              '- [ ] This site: `lib/content.ts`, `lib/assistant-context.ts` and `public/llms.txt`',
              '- [ ] LinkedIn',
              '- [ ] GitHub profile README (`EduardoVisconti/EduardoVisconti`)',
              '- [ ] `forja-case-study`',
              '',
              '### Reminder',
              '',
              'If a number changes in `content.ts`, change it in `assistant-context.ts`,',
              '`public/llms.txt` and `README.md` too. `npm run invariants` checks the first',
              'two and `llms.txt`; the README is on you.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Portfolio refresh - ${month}`,
              body,
              assignees: ['EduardoVisconti'],
            });
