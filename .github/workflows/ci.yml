name: CI

# The site claims a CI gate that fails the pull request. This is that gate.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # `npm install`, not `npm ci`: package-lock.json still carries the
      # dependencies pruned in this branch. Regenerate the lock locally
      # (`npm install` and commit it) and this can go back to `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
