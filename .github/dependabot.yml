version: 2

# Nothing in this repo was watching its own dependencies until issue #40, when
# ESLint 10 was blocked by eslint-plugin-react calling context.getFilename().
# eslint-config-next 16.4.0 fixed it upstream by putting the removed context
# methods back for the plugins it bundles, five days after #55 failed on it.
# A repo with no watcher finds out about a release like that by someone
# remembering to look.
#
# Grouped rather than per-package: fourteen dependencies can produce fourteen
# pull requests a month, and a maintainer who starts ignoring the bot has bought
# nothing. Majors are the exception - they arrive alone, because the first run
# proved a batch is only as mergeable as its most blocked member.
#
# This file is about versions. Vulnerabilities travel off this schedule, as
# Dependabot security updates, which are switched on in the repository
# settings. osv-scanner in CI fails a pull request that carries one, but a red
# check on a bot pull request reads as the bot's problem. next 16.3.4 stayed in
# production six weeks after its first critical advisory that way: security
# updates were off, and the monthly pull request that did bump next was red on
# the same audit as every other one.

updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. Dependabot schedules per ecosystem rather than per
    # group, and security fixes do not wait for this, so weekly bought nothing
    # but more pull requests to read.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # Types follow the oldest Node the site supports, not the newest Node.
    # next requires >=20.9, so @types/node stays on 20 and code that typechecks
    # runs on every supported runtime. It moves a major by hand, when the floor
    # does. The first run offered 26, which describes APIs Node 20 does not have.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # Kept apart from everything else. ESLint plugins lag ESLint majors, and
      # when one does, the lint bump should fail on its own instead of taking a
      # Next patch down with it.
      eslint:
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
      # Everything else, batched into one - but minor and patch only. The
      # first run put next 15 -> 16, typescript 5 -> 7 and @types/node 20 -> 26
      # in a single pull request, which then failed on "typescript-eslint does
      # not support TS 7.0" and took the other two down with it. One blocked
      # major must not hold the rest hostage, so majors fall out of the group
      # and arrive one pull request each, judged on their own.
      rest:
        patterns:
          - "*"
        exclude-patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
        update-types:
          - minor
          - patch

  # The pipeline pins seven third-party actions by major tag. They go stale the
  # same way npm packages do, and unlike npm packages nothing else in CI is
  # looking at them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
